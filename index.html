<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aleksei Lopatin — Full-stack developer</title>
    <meta
      name="description"
      content="Portfolio of Aleksei Lopatin, full-stack developer working with React, TypeScript, FastAPI and Python. Projects, small React labs and a live currency converter."
    />
    <link rel="canonical" href="https://alekseilopatin.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#141210" />

    <!-- Превью для мессенджеров и соцсетей. og:image должен быть
         абсолютным адресом — относительный путь там не резолвится. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aleksei Lopatin" />
    <meta property="og:title" content="Aleksei Lopatin — Full-stack developer" />
    <meta
      property="og:description"
      content="React, TypeScript, FastAPI and Python. Projects, React labs and a live currency converter."
    />
    <meta property="og:url" content="https://alekseilopatin.com/" />
    <meta property="og:image" content="https://alekseilopatin.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,700;1,300&family=Raleway:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Ставим тему до отрисовки React — иначе на долю секунды
      // мигнёт тема по умолчанию вместо сохранённой.
      (function () {
        var t;
        try {
          t = localStorage.getItem('al-theme');
        } catch (e) {}
        document.documentElement.dataset.theme =
          ['ember', 'daylight', 'twilight'].indexOf(t) > -1 ? t : 'ember';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
